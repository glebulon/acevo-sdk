[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acevo-sdk"
version = "0.1.0"
description = "Python SDK for Assetto Corsa Evo log parsing and shared-memory telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gleb Zverinskiy", email = "gleb.zverinskiy@gmail.com" }]
maintainers = [{ name = "Gleb Zverinskiy", email = "gleb.zverinskiy@gmail.com" }]
keywords = [
    "assetto-corsa-evo",
    "ace",
    "acevo",
    "sim-racing",
    "telemetry",
    "racing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/glebulon/acevo-sdk"
Issues = "https://github.com/glebulon/acevo-sdk/issues"
Source = "https://github.com/glebulon/acevo-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"acevo.catalogs" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
